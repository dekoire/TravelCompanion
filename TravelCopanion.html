<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>TravelCopanion · AI Travel Companion</title>

<!-- Geist typeface -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  html, body {
    margin: 0; padding: 0; background: #06060C;
    font-family: Geist, -apple-system, system-ui, sans-serif;
    color: #EEF2FF;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: hidden;
  }

  *::-webkit-scrollbar { display: none; }
  * { scrollbar-width: none; }

  @keyframes shimmer {
    0%   { background-position:  100% 0; }
    100% { background-position: -100% 0; }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.5; transform: scale(0.85); }
  }
  @keyframes pulseRing {
    0%, 100% { box-shadow: 0 0 0 4px rgba(232,176,122,0.18), 0 0 18px #E8B07A; }
    50%      { box-shadow: 0 0 0 10px rgba(232,176,122,0.05), 0 0 24px #E8B07A; }
  }
  @keyframes aiOrbPulse {
    0%, 100% { transform: scale(1); filter: brightness(1); }
    50%      { transform: scale(1.06); filter: brightness(1.15); }
  }
  @keyframes pinPulse {
    0%, 100% { opacity: 0.4; r: 4; }
    50%      { opacity: 1; r: 6; }
  }
  @keyframes planDash {
    0%   { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: -48; }
  }
  @keyframes glowDrift {
    0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.6; }
    50%      { transform: translateX(-50%) scale(1.15); opacity: 0.9; }
  }
  @keyframes photoFloat {
    from { opacity: 0; transform: translateY(20px) scale(0.85) rotate(0deg); }
    to   { opacity: 1; transform: var(--final, scale(1)); }
  }
  @keyframes slideUp {
    from { transform: translateY(100%); opacity: 0.5; }
    to   { transform: translateY(0); opacity: 1; }
  }
  @keyframes orbSpin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  @keyframes caret {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }
  @keyframes fade {
    from { opacity: 0; } to { opacity: 1; }
  }

  button { -webkit-tap-highlight-color: transparent; font-family: inherit; }
  img { user-select: none; -webkit-user-drag: none; }

  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<!-- React 18 + Babel standalone -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<!-- Infrastructure -->
<script type="text/babel" src="src/ios-frame.jsx"></script>
<script type="text/babel" src="src/design-canvas.jsx"></script>
<script type="text/babel" src="src/tweaks-panel.jsx"></script>

<!-- Theme + shared components -->
<script type="text/babel" src="src/theme.jsx"></script>
<script type="text/babel" src="src/lib.jsx"></script>

<!-- Screens (onboarding) -->
<script type="text/babel" src="src/screen-welcome.jsx"></script>
<script type="text/babel" src="src/screen-login-email.jsx"></script>
<script type="text/babel" src="src/screen-setup.jsx"></script>
<script type="text/babel" src="src/screen-planning.jsx"></script>

<!-- Screens (trips) -->
<script type="text/babel" src="src/screen-trips.jsx"></script>
<script type="text/babel" src="src/screen-overview.jsx"></script>
<script type="text/babel" src="src/screen-planner.jsx"></script>

<!-- Screens (in-trip) -->
<script type="text/babel" src="src/screen-timeline.jsx"></script>
<script type="text/babel" src="src/screen-map.jsx"></script>
<script type="text/babel" src="src/screen-transport.jsx"></script>
<script type="text/babel" src="src/screen-detail.jsx"></script>
<script type="text/babel" src="src/screen-replace.jsx"></script>

<!-- Screens (companion & social) -->
<script type="text/babel" src="src/screen-chat.jsx"></script>
<script type="text/babel" src="src/screen-feed.jsx"></script>
<script type="text/babel" src="src/screen-review.jsx"></script>

<!-- Screens (account) -->
<script type="text/babel" src="src/screen-profile.jsx"></script>
<script type="text/babel" src="src/screen-pricing.jsx"></script>
<script type="text/babel" src="src/screen-share.jsx"></script>

<!-- App shell -->
<script type="text/babel" src="src/app.jsx"></script>

<!-- Boot -->
<script type="text/babel">
  function boot() {
    if (!window.App) { return setTimeout(boot, 50); }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  }
  boot();
</script>
</body>
</html>
